services:
  db:
    image: postgres:16-alpine
    container_name: database
    restart: unless-stopped

    # INFO: Claves de entorno
    enviroment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    # INFO: Puerto del container
    ports: "5432:5432"

    # INFO: Named volume para guardar los datos en el container
    volumes:
      postgres_data:/var/lib/postgresql/data

    # INFO: healthcheck para arrancar solo si la base de datos funciona
    healthcheck:
      test: ["CMD_SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    # INFO: Le decimos donde esta el dockerfile para crear la imagen
    build: .
    container_name: backend
    restart: unless-stopped
    enviroment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PORT: ${PORT}
    
    # INFO: puerto del backend
    ports: "3000:3000"

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:





